<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrocinador - Esporte Total</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: white;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .propaganda-container {
            text-align: center;
            max-width: 700px;
        }
        .logo-patrocinador {
            font-size: 3em;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .destaque {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px solid white;
        }
        .btn-patrocinio {
            background: #ff6b35;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        .btn-patrocinio:hover {
            transform: scale(1.05);
        }
        .info {
            font-size: 0.9em;
            margin-top: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="propaganda-container">
        <div class="logo-patrocinador">⚡</div>
        <h1>PATROCINADOR OFICIAL</h1>
        <div class="destaque">
            <h2>ENERGY SPORTS DRINK</h2>
            <p>A bebida oficial dos atletas de alto desempenho</p>
        </div>
        <p>Hidratação superior com eletrólitos e vitaminas essenciais</p>
        <p>Disponível em todos os estádios e arenas do Brasil</p>
        
        <button class="btn-patrocinio" onclick="window.open('https://exemplo.com', '_blank')">
            CONHEÇA MAIS
        </button>
        
        <p class="info">
            Use o cupom: <strong>ESPORTE2026</strong> para 20% de desconto
        </p>
    </div>
    
    <script>
        // Atualiza o título periodicamente para chamar atenção
        const titles = [
            "⚡ Energy Sports Drink",
            "🏆 Patrocinador Oficial",
            "💪 Combustível para Atletas",
            "🔥 Performance Máxima"
        ];
        let titleIndex = 0;
        
        setInterval(() => {
            document.querySelector('h1').textContent = titles[titleIndex];
            titleIndex = (titleIndex + 1) % titles.length;
        }, 3000);
    </script>
</body>
</html>
